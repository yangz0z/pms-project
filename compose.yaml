services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/pms
      DB_USERNAME: pms
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pms}
    ports:
      - "8989:8989"
