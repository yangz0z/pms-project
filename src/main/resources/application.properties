spring.application.name=pms

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pms}
spring.datasource.username=${DB_USERNAME:pms}
spring.datasource.password=${DB_PASSWORD:}

pms.hold.ttl=PT10M
pms.hold.sweep-interval=PT10S

pms.refund.lease=PT1M
pms.refund.sweep-interval=PT10S

# 느린 결제사 호출이 점유 만료 작업을 지연시키지 않도록 스케줄러 스레드 분리
spring.task.scheduling.pool.size=2

server.port=8989
